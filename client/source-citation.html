<!DOCTYPE html>
<html>
<head>
  <title>Source Citation Tool</title>
  <link rel="icon" type="image/x-icon" href="/logo.png">
  <script src="theme-loader.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard">
    <h1>Source Citation Tool</h1>
    <div class="card">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
        <input id="citation-author" placeholder="Author (Last, First)">
        <input id="citation-title" placeholder="Page or article title">
        <input id="citation-site" placeholder="Website name">
        <input id="citation-url" placeholder="https://example.com/page">
        <input id="citation-date" type="date">
      </div>
      <div class="assignment-tabs">
        <button id="citation-mla" class="tab-btn active">MLA</button>
        <button id="citation-apa" class="tab-btn">APA</button>
      </div>
      <div style="display:flex;gap:8px;margin:10px 0;">
        <button id="citation-generate" class="google-btn">Generate Citation</button>
        <button id="citation-copy-all" class="tab-btn">Copy All</button>
      </div>
      <p id="citation-output" style="color:var(--text-secondary);font-size:14px;">Your citation will appear here.</p>
      <ul id="citation-history"></ul>
    </div>
  </div>
  <script src="sidebar.js"></script>
  <script src="source-citation.js"></script>
</body>
</html>
