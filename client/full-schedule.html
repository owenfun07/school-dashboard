<!DOCTYPE html>
<html>
<head>
  <title>Full Schedule</title>
  <link rel="icon" type="image/x-icon" href="/logo.png">
  <script src="theme-loader.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard full-schedule-page">
    <div class="schedule-header">
      <h1>Full Schedule</h1>
      <div class="month-controls">
        <button id="prev-month" class="refresh-btn">←</button>
        <h2 id="month-title"></h2>
        <button id="next-month" class="refresh-btn">→</button>
        <button id="today-btn" class="refresh-btn">Today</button>
      </div>
    </div>
    <div id="full-schedule-loader" class="loader"></div>
    <div class="month-grid-header">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div id="month-grid" class="month-grid"></div>
  </div>

  <div id="event-modal" class="event-modal">
    <div class="event-modal-card">
      <button id="event-modal-close" class="menu-close" type="button">×</button>
      <h3 id="event-modal-title">Event Details</h3>
      <div id="event-modal-content"></div>
    </div>
  </div>

  <script src="sidebar.js"></script>
  <script src="developer-mode.js"></script>
  <script src="full-schedule.js"></script>
</body>
</html>
