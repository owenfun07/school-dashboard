<!DOCTYPE html>
<html>
<head>
  <title>Source Citation</title>

  <link rel="icon" type="image/x-icon" href="/logo.png">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="placeholder-page-1.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
</head>

<body>

<button id="menu-toggle" class="menu-toggle">☰</button>

<aside id="side-menu" class="side-menu">
  <button id="menu-close" class="menu-close">×</button>

  <h3>Menu</h3>

  <a href="/dashboard">Dashboard</a>
  <a href="/full-schedule">Full Schedule</a>
  <a href="/placeholder-page-1">Source Citation</a>
</aside>

<div id="menu-overlay" class="menu-overlay"></div>

<div class="dashboard">

  <div class="card">

    <h1>Source Citation</h1>

    <div class="top-tools">
      <input
        id="urlInput"
        placeholder="Paste URL to auto-fill metadata">

      <button id="generateBtn">
        Generate Metadata
      </button>
    </div>

    <div class="form-grid">

      <input id="title" placeholder="Title">

      <input id="author" placeholder="Author">

      <input id="publisher" placeholder="Publisher">

      <input id="url" placeholder="URL">

      <input id="publishDate" type="date">

      <input id="accessDate" type="date">

      <select id="style">
        <option value="mla">MLA</option>
        <option value="apa">APA</option>
        <option value="chicago">Chicago</option>
      </select>

      <button id="addSource">
        Add Citation
      </button>

    </div>

  </div>

  <div class="card">

    <div class="toolbar">

      <input
        id="search"
        placeholder="Search citations">

      <select id="globalStyle">
        <option value="mla">MLA</option>
        <option value="apa">APA</option>
        <option value="chicago">Chicago</option>
      </select>

      <button id="applyStyle">
        Convert All
      </button>

      <button id="copySelected">
        Copy Selected
      </button>

      <button id="copyAll">
        Copy All
      </button>

      <button id="exportBib">
        Export BibTeX
      </button>

      <button id="exportTxt">
        Export TXT
      </button>

      <button id="exportDocx">
        Export DOCX
      </button>

    </div>

    <h3>
      Sources:
      <span id="citationCount">0</span>
    </h3>

    <div id="citationList"></div>

    <hr>

    <h3>Bulk Import URLs</h3>

    <textarea
      id="bulkUrls"
      placeholder="One URL per line"></textarea>

    <button id="importUrls">
      Import URLs
    </button>

  </div>

</div>

<script>

let citations =
JSON.parse(
localStorage.getItem("citations") || "[]"
);

function saveData() {
  localStorage.setItem(
    "citations",
    JSON.stringify(citations)
  );
}

function formatCitation(source) {

  switch(source.style) {

    case "apa":
      return `${source.author}. (${source.publishDate || "n.d."}). ${source.title}. ${source.publisher}. ${source.url}`;

    case "chicago":
      return `${source.author}. "${source.title}." ${source.publisher}. Accessed ${source.accessDate}. ${source.url}`;

    default:
      return `${source.author}. "${source.title}." ${source.publisher}, ${source.publishDate}, ${source.url}. Accessed ${source.accessDate}.`;
  }

}

function render() {

  const search =
  document
  .getElementById("search")
  .value
  .toLowerCase();

  const list =
  document.getElementById(
    "citationList"
  );

  list.innerHTML = "";

  const filtered =
  citations.filter(c =>
    JSON.stringify(c)
    .toLowerCase()
    .includes(search)
  );

  filtered.forEach(source => {

    const item =
    document.createElement("div");

    item.className =
    "citation-item";

    item.innerHTML = `
      <input
        type="checkbox"
        class="citationCheck">

      <div class="citation-content">

        <div class="citation-text">
          ${formatCitation(source)}
        </div>

      </div>

      <button class="editBtn">
        Edit
      </button>

      <button class="deleteBtn">
        Delete
      </button>
    `;

    item
    .querySelector(".deleteBtn")
    .onclick = () => {

      citations =
      citations.filter(
        c => c.id !== source.id
      );

      saveData();

      render();
    };

    item
    .querySelector(".editBtn")
    .onclick = () => {

      title.value =
      source.title;

      author.value =
      source.author;

      publisher.value =
      source.publisher;

      url.value =
      source.url;

      publishDate.value =
      source.publishDate;

      accessDate.value =
      source.accessDate;

      style.value =
      source.style;

      citations =
      citations.filter(
        c => c.id !== source.id
      );

      saveData();

      render();
    };

    list.appendChild(item);

  });

  document
  .getElementById("citationCount")
  .textContent =
  filtered.length;

}

document
.getElementById("addSource")
.onclick = () => {

  citations.push({

    id: Date.now(),

    title: title.value,

    author: author.value,

    publisher: publisher.value,

    url: url.value,

    publishDate:
      publishDate.value,

    accessDate:
      accessDate.value,

    style:
      style.value

  });

  saveData();

  render();

};

document
.getElementById("search")
.oninput =
render;

document
.getElementById("applyStyle")
.onclick = () => {

  const newStyle =
  globalStyle.value;

  citations.forEach(c => {
    c.style = newStyle;
  });

  saveData();

  render();

};

document
.getElementById("copyAll")
.onclick =
async () => {

  const text =
  citations
  .map(formatCitation)
  .join("\n\n");

  await navigator
  .clipboard
  .writeText(text);

  alert("Copied all citations");
};

document
.getElementById("copySelected")
.onclick =
async () => {

  const checks =
  document.querySelectorAll(
    ".citationCheck"
  );

  let output = [];

  checks.forEach((box,index)=>{

    if(box.checked){

      output.push(
        formatCitation(
          citations[index]
        )
      );

    }

  });

  await navigator
  .clipboard
  .writeText(
    output.join("\n\n")
  );

  alert("Copied selected citations");

};

document
.getElementById("exportBib")
.onclick = () => {

  let text = "";

  citations.forEach(c => {

    text += `
@misc{${c.id},
title={${c.title}},
author={${c.author}},
publisher={${c.publisher}},
url={${c.url}}
}

`;

  });

  downloadFile(
    text,
    "citations.bib",
    "text/plain"
  );

};

document
.getElementById("exportTxt")
.onclick = () => {

  const text =
  citations
  .map(formatCitation)
  .join("\n\n");

  downloadFile(
    text,
    "citations.txt",
    "text/plain"
  );

};

document
.getElementById("exportDocx")
.onclick =
async () => {

  const paragraphs =
  citations.map(c =>
    new docx.Paragraph(
      formatCitation(c)
    )
  );

  const doc =
  new docx.Document({

    sections: [
      {
        children:
        paragraphs
      }
    ]

  });

  const blob =
  await docx.Packer
  .toBlob(doc);

  saveAs(
    blob,
    "citations.docx"
  );

};

function downloadFile(
  content,
  filename,
  type
){

  const blob =
  new Blob(
    [content],
    {type}
  );

  const url =
  URL.createObjectURL(
    blob
  );

  const a =
  document.createElement("a");

  a.href = url;

  a.download =
  filename;

  a.click();

  URL.revokeObjectURL(url);

}

document
.getElementById("generateBtn")
.onclick =
async () => {

  const target =
  urlInput.value.trim();

  if(!target) return;

  try {

    const response =
    await fetch(
      `https://api.allorigins.win/raw?url=${encodeURIComponent(target)}`
    );

    const html =
    await response.text();

    const parser =
    new DOMParser();

    const doc =
    parser.parseFromString(
      html,
      "text/html"
    );

    title.value =
    doc.title || "";

    url.value =
    target;

    const authorMeta =
    doc.querySelector(
      'meta[name="author"]'
    );

    if(authorMeta){

      author.value =
      authorMeta.content;

    }

  }

  catch {

    alert(
      "Unable to fetch metadata."
    );

  }

};

document
.getElementById("importUrls")
.onclick =
() => {

  const urls =
  bulkUrls.value
  .split("\n")
  .filter(Boolean);

  urls.forEach(link => {

    citations.push({

      id:
      Date.now() +
      Math.random(),

      title: "",

      author: "",

      publisher: "",

      url: link,

      publishDate: "",

      accessDate:
      new Date()
      .toISOString()
      .split("T")[0],

      style: "mla"

    });

  });

  saveData();

  render();

};

render();

</script>

<script src="full-schedule.js"></script>

</body>
</html>
