<!DOCTYPE html>
<html>
<head>
  <title>Source Citation</title>
  <link rel="icon" type="image/x-icon" href="/logo.png">
  <script src="theme-loader.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="placeholder-page-1.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
</head>
<body>
<div class="dashboard">
  <div class="card">
    <h1>Source Citation</h1>
    <div class="top-tools url-row">
      <input id="urlInput" placeholder="Paste URL to auto-fill metadata">
      <button id="generateBtn" class="primary-btn">Generate Metadata</button>
    </div>
    <div id="metaLoading" class="loading hidden">
      <div class="spinner"></div>
      <span>Fetching metadata...</span>
    </div>
    <div class="form-grid">
      <input id="title" placeholder="Title">
      <input id="author" placeholder="Author">
      <input id="publisher" placeholder="Publisher">
      <input id="url" placeholder="URL">
      <input id="publishDate" type="date">
      <input id="accessDate" type="date">
      <select id="style">
        <option value="mla">MLA</option>
        <option value="apa">APA</option>
        <option value="chicago">Chicago</option>
      </select>
      <div class="citation-form-actions">
        <button id="addSource" class="add-btn">Add Citation</button>
        <button id="clearForm" type="button" class="tab-btn">Clear Form</button>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="toolbar">
      <input id="search" placeholder="Search citations">
      <select id="globalStyle">
        <option value="mla">MLA</option>
        <option value="apa">APA</option>
        <option value="chicago">Chicago</option>
      </select>
      <button id="copySelected">Copy Selected</button>
      <button id="copyAll">Copy All</button>
      <button id="exportBib">Export BibTeX</button>
      <button id="exportTxt">Export TXT</button>
      <button id="exportDocx">Export DOCX</button>
    </div>
    <h3>Sources: <span id="citationCount">0</span></h3>
    <div id="citationList"></div>
  </div>
</div>
<script>
let citations = JSON.parse(localStorage.getItem("citations") || "[]");
function saveData() { localStorage.setItem("citations", JSON.stringify(citations)); }
function formatCitation(source) {
  switch (source.style) {
    case "apa":     return `${source.author}. (${source.publishDate || "n.d."}). ${source.title}. ${source.publisher}. ${source.url}`;
    case "chicago": return `${source.author}. "${source.title}." ${source.publisher}. Accessed ${source.accessDate}. ${source.url}`;
    default:        return `${source.author}. "${source.title}." ${source.publisher}, ${source.publishDate}, ${source.url}. Accessed ${source.accessDate}.`;
  }
}
function clearCitationForm() { title.value=""; author.value=""; publisher.value=""; url.value=""; publishDate.value=""; accessDate.value=""; style.value="mla"; urlInput.value=""; }
function render() {
  const search = document.getElementById("search").value.toLowerCase();
  const list = document.getElementById("citationList"); list.innerHTML = "";
  const filtered = citations.filter(c => JSON.stringify(c).toLowerCase().includes(search));
  filtered.forEach(source => {
    const item = document.createElement("div"); item.className = "citation-item";
    item.innerHTML = `<input type="checkbox" class="citationCheck"><div class="citation-content"><div class="citation-text">${formatCitation(source)}</div></div><button class="editBtn">Edit</button><button class="deleteBtn">Delete</button>`;
    item.querySelector(".deleteBtn").onclick = () => { citations = citations.filter(c => c.id !== source.id); saveData(); render(); };
    item.querySelector(".editBtn").onclick = () => {
      title.value=source.title; author.value=source.author; publisher.value=source.publisher;
      url.value=source.url; publishDate.value=source.publishDate; accessDate.value=source.accessDate; style.value=source.style;
      citations = citations.filter(c => c.id !== source.id); saveData(); render();
    };
    list.appendChild(item);
  });
  document.getElementById("citationCount").textContent = filtered.length;
}
document.getElementById("addSource").onclick = () => { citations.push({ id:Date.now(), title:title.value, author:author.value, publisher:publisher.value, url:url.value, publishDate:publishDate.value, accessDate:accessDate.value, style:style.value }); saveData(); render(); clearCitationForm(); };
document.getElementById("search").oninput = render;
document.getElementById("clearForm").onclick = clearCitationForm;
document.getElementById("globalStyle").onchange = () => { const s=globalStyle.value; citations.forEach(c=>{c.style=s;}); saveData(); render(); };
document.getElementById("copyAll").onclick = async () => { await navigator.clipboard.writeText(citations.map(formatCitation).join("\n\n")); alert("Copied all citations"); };
document.getElementById("copySelected").onclick = async () => { const checks=document.querySelectorAll(".citationCheck"),output=[]; checks.forEach((box,i)=>{ if(box.checked) output.push(formatCitation(citations[i])); }); await navigator.clipboard.writeText(output.join("\n\n")); alert("Copied selected"); };
document.getElementById("exportBib").onclick = () => { let text=""; citations.forEach(c=>{text+=`\n@misc{${c.id},\ntitle={${c.title}},\nauthor={${c.author}},\npublisher={${c.publisher}},\nurl={${c.url}}\n}\n`;}); downloadFile(text,"citations.bib","text/plain"); };
document.getElementById("exportTxt").onclick = () => downloadFile(citations.map(formatCitation).join("\n\n"),"citations.txt","text/plain");
document.getElementById("exportDocx").onclick = async () => { const paragraphs=citations.map(c=>new docx.Paragraph(formatCitation(c))); const doc=new docx.Document({sections:[{children:paragraphs}]}); const blob=await docx.Packer.toBlob(doc); saveAs(blob,"citations.docx"); };
function downloadFile(content,filename,type) { const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement("a"); a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url); }
// ── Metadata fetch ──────────────────────────────────────────────────
// Strategy:
//   1. Try Microlink API (rich metadata: title, author, date, publisher)
//   2. If Microlink returns 429 (rate limit hit), fall back to raw HTML scrape
//      and show a notice so the user knows quality may be lower.

function showMetaNotice(msg, isWarning) {
  let el = document.getElementById("meta-notice");
  if (!el) {
    el = document.createElement("div");
    el.id = "meta-notice";
    el.style.cssText = "margin-top:8px;padding:8px 12px;border-radius:8px;font-size:13px;line-height:1.5;";
    document.getElementById("metaLoading").insertAdjacentElement("afterend", el);
  }
  el.style.background   = isWarning ? "#fef3c7" : "#f0fdf4";
  el.style.color        = isWarning ? "#92400e" : "#166534";
  el.style.border       = isWarning ? "1px solid #fde68a" : "1px solid #bbf7d0";
  el.textContent = msg;
  el.classList.remove("hidden");
}

function hideMetaNotice() {
  const el = document.getElementById("meta-notice");
  if (el) el.classList.add("hidden");
}

// Parse a date string from Microlink into YYYY-MM-DD for the date input
function parseISODate(str) {
  if (!str) return "";
  try {
    const d = new Date(str);
    if (isNaN(d.getTime())) return "";
    return d.toISOString().split("T")[0];
  } catch { return ""; }
}

// Fallback: scrape raw HTML via allorigins proxy
async function fetchViaHtmlScrape(target) {
  const response = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(target)}`);
  if (!response.ok) throw new Error("Could not fetch page");
  const html = await response.text();
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, "text/html");

  // Try Open Graph + standard meta tags manually since we have the raw HTML
  const get = (sel) => doc.querySelector(sel)?.content?.trim() || "";

  title.value     = get('meta[property="og:title"]') || get('meta[name="twitter:title"]') || doc.title || "";
  author.value    = get('meta[name="author"]') || get('meta[property="article:author"]') || "";
  publisher.value = get('meta[property="og:site_name"]') || new URL(target).hostname.replace("www.","") || "";
  url.value       = target;

  const rawDate = get('meta[property="article:published_time"]') || get('meta[name="date"]') || get('meta[name="pubdate"]');
  publishDate.value = parseISODate(rawDate);
  accessDate.value  = new Date().toISOString().split("T")[0];
}

document.getElementById("generateBtn").onclick = async () => {
  const target = urlInput.value.trim();
  if (!target) return;

  const loading = document.getElementById("metaLoading");
  loading.classList.remove("hidden");
  hideMetaNotice();

  try {
    // ── Step 1: Try Microlink ───────────────────────────────────────
    const mlUrl = `https://api.microlink.io?url=${encodeURIComponent(target)}&meta=true`;
    const mlResp = await fetch(mlUrl);

    if (mlResp.status === 429) {
      // Rate limit hit — fall back to HTML scrape
      showMetaNotice(
        "⚠️ Daily metadata limit reached (Microlink allows 50 free requests/day). " +
        "Falling back to basic extraction — some fields may be missing.",
        true
      );
      await fetchViaHtmlScrape(target);
      return;
    }

    if (!mlResp.ok) throw new Error("Microlink error " + mlResp.status);

    const ml = await mlResp.json();

    if (ml.status !== "success" || !ml.data) {
      // Microlink couldn't parse it — fall back silently
      await fetchViaHtmlScrape(target);
      showMetaNotice("ℹ️ Couldn't extract full metadata for this page — filled in what was available.", false);
      return;
    }

    // ── Step 2: Fill fields from Microlink data ─────────────────────
    const d = ml.data;

    title.value     = d.title     || "";
    author.value    = d.author    || "";
    publisher.value = d.publisher || d.url?.split("/")[2]?.replace("www.","") || "";
    url.value       = target;

    // Microlink returns date as ISO string
    publishDate.value = parseISODate(d.date);
    // Always set access date to today
    accessDate.value  = new Date().toISOString().split("T")[0];

    // Show a success notice if anything was actually found
    const filled = [title.value, author.value, publisher.value, publishDate.value].filter(Boolean).length;
    if (filled >= 2) {
      showMetaNotice("✓ Metadata fetched successfully. Review the fields before adding.", false);
    } else {
      showMetaNotice("ℹ️ Only partial metadata could be found for this page. Fill in any missing fields manually.", false);
    }

  } catch (err) {
    // Network error or both methods failed
    try {
      await fetchViaHtmlScrape(target);
      showMetaNotice("ℹ️ Used basic extraction — some fields may be missing.", false);
    } catch {
      showMetaNotice("⚠️ Could not fetch metadata. Please fill in the fields manually.", true);
    }
  } finally {
    loading.classList.add("hidden");
  }
};
render();
</script>
<script src="sidebar.js"></script>
</body>
</html>
